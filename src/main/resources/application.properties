# ============================================================
# Oracle DDL Generator - Configuration
# ============================================================
# Update these values before running.

# --- Database Connection ---
db.url=jdbc:oracle:thin:@//localhost:1521/ORCL
db.username=YOUR_USERNAME
db.password=YOUR_PASSWORD

# --- Target Schema ---
# The schema to extract DDL from (UPPER CASE).
# If blank, defaults to the connected user's schema.
target.schema=ENTITY

# --- Output ---
# Root folder where generated scripts will be written.
# A subfolder named after the schema will be created inside.
output.dir=./ddl_output

# --- Options ---
# Include storage/tablespace clauses in generated DDL? (true/false)
# Set to false for portable scripts that let the DBA control placement.
include.storage=false

# Include GRANT statements? (true/false)
include.grants=true
